name: Build Luna APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate missing Gradle Wrapper and App files
      run: |
        # إنشاء ملف الـ Wrapper
        mkdir -p gradle/wrapper
        echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
        echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
        echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
        
        # إنشاء ملف settings.gradle.kts
        echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' > settings.gradle.kts
        echo 'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }' >> settings.gradle.kts
        echo 'rootProject.name = "Luna"' >> settings.gradle.kts
        echo 'include(":app")' >> settings.gradle.kts

        # إنشاء ملف build.gradle.kts الرئيسي
        echo 'plugins { id("com.android.application") version "8.5.2" apply false; id("org.jetbrains.kotlin.android") version "2.0.20" apply false }' > build.gradle.kts

        # إنشاء ملفات التطبيق app
        mkdir -p app/src/main/java/com/luna/assistant
        echo 'plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }' > app/build.gradle.kts
        echo 'android { namespace = "com.luna.assistant"; compileSdk = 34; defaultConfig { applicationId = "com.luna.assistant"; minSdk = 26; targetSdk = 34; versionCode = 1; versionName = "1.0" } }' >> app/build.gradle.kts
        echo 'dependencies { implementation("androidx.core:core-ktx:1.13.1") }' >> app/build.gradle.kts

        # إنشاء ملف MainActivity
        echo 'package com.luna.assistant' > app/src/main/java/com/luna/assistant/MainActivity.kt
        echo 'import android.app.Activity' >> app/src/main/java/com/luna/assistant/MainActivity.kt
        echo 'import android.os.Bundle' >> app/src/main/java/com/luna/assistant/MainActivity.kt
        echo 'class MainActivity : Activity() { override fun onCreate(savedInstanceState: Bundle?) { super.onCreate(savedInstanceState) } }' >> app/src/main/java/com/luna/assistant/MainActivity.kt

        # إنشاء AndroidManifest.xml
        mkdir -p app/src/main
        echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Luna"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build with Gradle
      run: |
        gradle wrapper --gradle-version 8.7
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Luna-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
